<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Manager</title>
</head>
<body>
    <form action="/localizar" method="POST" enctype="multipart/form-data">
        <h1>Nombre: {{data.nombre}} - ({{data.alias}})</h1>
        <p>Certeza: {{data.certeza}}</p>
        <img src="{{data.img}}" alt="Imagen de la planta" width="300px">
        <button type="submit">Enviar Info de riego</button>
    </form>
    <button onclick="volver()">Intentar nuevamente</button>
</body>
<script>
    function volver() {
        window.location.href = "/";
    }
</script>
</html>
